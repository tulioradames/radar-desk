[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-desk"
version = "0.1.0"
description = "Aplicativo Windows para abertura e gerenciamento de chamados."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
]

[project.scripts]
radar-desk = "radar_desk.main:main"

[tool.setuptools.packages.find]
include = ["radar_desk*"]

[tool.setuptools.package-data]
"radar_desk.resources" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
